# Only keys that are not already the English text they render. Everything else in index.jelly
# uses ${%literal English}, which Jelly falls back to when no translation is present.
preview.hint.savable=Changes here are a preview until you save them. Save this look writes it to the view, so the kiosk page and full screen open with it too. A look can also go in the kiosk URL instead, for example ?palette=neon or ?shape=octagon or ?sort=status.
preview.hint.readonly=Preview only, nothing here is saved. Put a look in the kiosk URL to keep it, for example ?palette=neon or ?shape=octagon or ?sort=status.
saved.ok=Saved. The kiosk page and full screen will open with this look.
saved.failed=Could not save. Check that you still have permission to configure this view.
